spring.application.name=bsmartone

# =========================
# Database connection
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bsmartone}
spring.datasource.username=${DB_USERNAME:bsmartone}
spring.datasource.password=${DB_PASSWORD:bsmartone}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","logger":"%c{1}","msg":"%m","requestId":"%X{requestId}"}%n

server.port=${SERVER_PORT:8013}

# JWT
jwt.secret=${JWT_SECRET:change-me-in-env}
jwt.expiration=${JWT_EXPIRATION:1800000}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}

# Optional timeouts
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_CONNECTION:50000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_READ:50000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_WRITE:50000}
